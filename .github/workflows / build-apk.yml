name: Build MLBB Companion APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir source
          unzip -q *.zip -d source

      - name: Find Cordova project
        run: |
          PROJECT=$(find source -name config.xml -type f -printf '%h\n' | head -n 1)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install dependencies
        working-directory: ${{ env.PROJECT }}
        run: npm install

      - name: Add Android platform
        working-directory: ${{ env.PROJECT }}
        run: cordova platform add android@15.1.0

      - name: Build APK
        working-directory: ${{ env.PROJECT }}
        run: cordova build android --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MLBB-Companion-Pro-Android
          path: ${{ env.PROJECT }}/platforms/android/app/build/outputs/apk/release/*.apk
